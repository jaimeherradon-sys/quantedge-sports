name: GOAT NBA odds - collect real market snapshots (NO BET)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'live (only future games), or opening (historical opening prices)'
        required: true
        type: choice
        default: live
        options:
          - live
          - opening
      game_date:
        description: 'NBA game date YYYY-MM-DD (blank = today UTC; for opening choose a past date)'
        required: false
        default: ''
        type: string
      max_games:
        description: 'Maximum games to query, conserves trial API calls'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
permissions:
  contents: read
concurrency:
  group: balldontlie-shared-api-key
  cancel-in-progress: false
jobs:
  collect-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
      MODE: ${{ inputs.mode }}
      GAME_DATE: ${{ inputs.game_date }}
      MAX_GAMES: ${{ inputs.max_games }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Run provider contract and market mathematics tests
        run: python -m pytest -q tests/test_goat_odds.py tests/test_market_audit.py
      - name: Require API key
        shell: bash
        run: |
          if [[ -z "$BDL_API_KEY" ]]; then
            echo '::error::BDL_API_KEY missing in Actions secrets'
            exit 1
          fi
      - name: Fetch strictly as-of market quotes and raw evidence
        shell: bash
        run: |
          if [[ -z "$GAME_DATE" ]]; then
            GAME_DATE="$(date -u +%F)"
          fi
          python -m sports_betting_ai.goat_odds "$MODE" \
            --date "$GAME_DATE" --max-games "$MAX_GAMES" \
            --db data/goat-odds.sqlite --report reports/goat-odds-summary.json \
            --spacing-seconds 18
      - name: Audit market integrity and flag cross-book line deviations
        if: success()
        run: python -m sports_betting_ai.market_audit --db data/goat-odds.sqlite --out reports/goat-market-integrity.json
      - name: Summarize audited market coverage
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open('reports/goat-odds-summary.json', encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### GOAT NBA odds audit (NO BET)\n')
              for key in ('kind','date','games_seen','games_selected','quote_rows','two_way_pairs','raw_response_envelopes','sqlite_integrity'):
                  if key in r:
                      f.write(f'- {key}: **{r[key]}**\n')
              m=json.load(open('reports/goat-market-integrity.json', encoding='utf-8'))
              f.write(f"- Markets flagged for review (non-standard lines): **{m['nonstandard_line_quote_count']}**\n")
              f.write(f"- Two-way median margin: **{m['median_two_way_margin_pct']}%**\n")
              f.write('- **These are market quotes, not model predictions or recommendations.**\n')
              f.write('- Bookmaker coverage is not guaranteed. Opening prices are not closing prices.\n')
          PY
      - name: Archive raw provider responses and normalized SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-goat-odds-${{ github.run_id }}
          path: |
            data/goat-odds.sqlite
            reports/goat-odds-summary.json
            reports/goat-market-integrity.json
          if-no-files-found: warn
          retention-days: 30
