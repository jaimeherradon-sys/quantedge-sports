name: Check NBA data connections
on:
  workflow_dispatch:
concurrency:
  group: balldontlie-shared-api-key
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research CLI
        run: python -m pip install -e .
      - name: Require BALLDONTLIE key and verify authentication
        shell: bash
        run: |
          if [[ -z "$BDL_API_KEY" ]]; then
            echo '::error::BDL_API_KEY is not configured. Add it in Actions secrets.'
            echo '- BALLDONTLIE: missing key (FAILED)' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          sbai check --provider bdl
          echo '- BALLDONTLIE: /v1/teams authenticated successfully' >> "$GITHUB_STEP_SUMMARY"
          echo '- Player-game stats: NOT verified (paid tier needed)' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify free NBA games access
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from sports_betting_ai.connectors import BallDontLie, utcnow
          today = date.today()
          start = (today - timedelta(days=2)).isoformat()
          end = today.isoformat()
          rows = list(BallDontLie().games(start, end))
          print(f"BALLDONTLIE /v1/games reached; {len(rows)} games found between {start} and {end}. Checked {utcnow()}.")
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'- BALLDONTLIE: games endpoint verified; {len(rows)} games in {start} to {end} (not all completed)\n')
          PY
      - name: Test optional The Odds API key
        shell: bash
        run: |
          if [[ -z "$ODDS_API_KEY" ]]; then
            echo '- The Odds API: not configured (optional)' >> "$GITHUB_STEP_SUMMARY"
          else
            sbai check --provider odds
            echo '- The Odds API: sports endpoint verified; NBA props not verified' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Explain limitations
        if: always()
        run: |
          echo '- NO BET until licensed game stats, pre-game odds and chronological validation are available.' >> "$GITHUB_STEP_SUMMARY"
