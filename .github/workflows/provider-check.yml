name: Check NBA data connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research CLI
        run: python -m pip install -e .
      - name: Test BALLDONTLIE free endpoint
        shell: bash
        run: |
          if [[ -z "$BDL_API_KEY" ]]; then
            echo 'BDL_API_KEY not configured'
            echo '- BALLDONTLIE: missing API key' >> "$GITHUB_STEP_SUMMARY"
          else
            sbai check --provider bdl
            echo '- BALLDONTLIE: basic endpoint verified' >> "$GITHUB_STEP_SUMMARY"
            echo '- Player-game stats: NOT tested (paid tier required)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test The Odds API free endpoint
        shell: bash
        run: |
          if [[ -z "$ODDS_API_KEY" ]]; then
            echo 'ODDS_API_KEY not configured'
            echo '- The Odds API: missing API key' >> "$GITHUB_STEP_SUMMARY"
          else
            sbai check --provider odds
            echo '- The Odds API: sports endpoint verified; props not verified' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Explain the limitation
        run: |
          echo '- NO BET expected until licensed historical stats, real odds and temporal validation are available.' >> "$GITHUB_STEP_SUMMARY"
