name: NBA daily research (NO BET on missing data)
on:
  schedule:
    - cron: '35 09 * * *'
    - cron: '05 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SBAI_DB: data/sports.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache research DB (not a guaranteed durable archive)
        uses: actions/cache@v4
        with:
          path: data/sports.db
          key: nba-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nba-db-${{ runner.os }}-
      - run: python -m pip install -e '.[test]'
      - name: Run research refresh
        run: sbai update --days 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-research-${{ github.run_id }}
          path: |
            reports/
            data/sports.db
            models/validation.json
          retention-days: 30
