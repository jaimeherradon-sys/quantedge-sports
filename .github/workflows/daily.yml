name: Paid NBA player-statistics research (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SBAI_DB: data/sports.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Require licensed game-player stats endpoint
        run: sbai check --provider bdl-stats
      - name: Train and generate research report
        run: sbai update --days 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paid-nba-research-${{ github.run_id }}
          path: |
            reports/
            data/sports.db
            models/validation.json
          retention-days: 30
