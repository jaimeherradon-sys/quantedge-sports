[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-betting-ai"
version = "0.1.0"
description = "Auditable NBA player-props research system; fail-closed betting signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "requests>=2.31,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
ml = ["xgboost>=2,<4", "lightgbm>=4,<6"]
dashboard = ["streamlit>=1.35,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
sbai = "sports_betting_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
